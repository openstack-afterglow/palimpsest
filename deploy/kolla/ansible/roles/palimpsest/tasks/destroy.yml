---
- name: Select host-local Palimpsest services
  ansible.builtin.include_tasks: select_services.yml

- name: Destroy | Stop and remove enabled local Palimpsest containers
  become: true
  community.docker.docker_container:
    name: "{{ item.value.container_name }}"
    state: absent
  loop: "{{ palimpsest_local_services | dict2items }}"
