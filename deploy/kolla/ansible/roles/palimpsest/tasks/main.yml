---
- name: Validate requested Palimpsest lifecycle action
  ansible.builtin.assert:
    that:
      - kolla_action | default('deploy') in ['precheck', 'pull', 'deploy', 'reconfigure', 'upgrade', 'destroy', 'config', 'start', 'stop']
    fail_msg: "Unsupported kolla_action '{{ kolla_action | default('deploy') }}' for palimpsest"

- name: Select host-local Palimpsest services
  ansible.builtin.include_tasks: select_services.yml

- name: Run requested Palimpsest lifecycle action
  ansible.builtin.include_tasks: "{{ kolla_action | default('deploy') }}.yml"
