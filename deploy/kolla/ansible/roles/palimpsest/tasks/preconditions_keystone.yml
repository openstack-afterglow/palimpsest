---
- name: Keystone | Register Palimpsest service, project, and user
  ansible.builtin.import_role:
    name: service-ks-register
  vars:
    project_name: palimpsest
    service_ks_register_auth: "{{ openstack_auth }}"
    service_ks_register_services:
      - name: palimpsest
        type: palimpsest
        description: "Palimpsest Hub layer repository service"
        endpoints:
          - interface: public
            url: "{{ palimpsest_public_endpoint_url }}"
          - interface: internal
            url: "{{ palimpsest_internal_endpoint_url }}"
          - interface: admin
            url: "{{ palimpsest_admin_endpoint_url }}"
    service_ks_register_users:
      - project: "{{ palimpsest_service_project_name }}"
        user: "{{ palimpsest_keystone_user }}"
        password: "{{ palimpsest_keystone_password }}"
        role: admin
  no_log: true

- name: Keystone | Register dedicated read-only token validator
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.identity_user
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ palimpsest_reader_user }}"
      password: "{{ palimpsest_reader_password }}"
      domain: "{{ palimpsest_reader_user_domain_name }}"
      enabled: true
      update_password: always
      state: present
      interface: "{{ openstack_interface | default('internal') }}"
      region_name: "{{ openstack_region_name }}"
      cacert: "{{ openstack_cacert | default(omit, true) }}"
      validate_certs: "{{ not (openstack_insecure | default(false) | bool) }}"
  become: true
  register: palimpsest_reader_identity
  no_log: true
  run_once: true
  delegate_to: "{{ groups['palimpsest'][0] }}"

- name: Keystone | Assign validator system reader role only
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.role_assignment
    module_args:
      auth: "{{ openstack_auth }}"
      user: "{{ palimpsest_reader_identity.user.id }}"
      role: reader
      system: all
      state: present
      interface: "{{ openstack_interface | default('internal') }}"
      region_name: "{{ openstack_region_name }}"
      cacert: "{{ openstack_cacert | default(omit, true) }}"
      validate_certs: "{{ not (openstack_insecure | default(false) | bool) }}"
  become: true
  no_log: true
  run_once: true
  delegate_to: "{{ groups['palimpsest'][0] }}"
