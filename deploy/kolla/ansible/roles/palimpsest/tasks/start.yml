---
- name: Start | Stat Palimpsest config file
  become: true
  ansible.builtin.stat:
    path: "{{ palimpsest_config_dir }}/palimpsest.conf"
  register: palimpsest_config_stat
  when: inventory_hostname in groups['palimpsest']

- name: Start | Start Palimpsest containers
  become: true
  community.docker.docker_container:
    name: "{{ item.value.container_name }}"
    image: "{{ item.value.image }}"
    pull: "{{ 'never' if (palimpsest_source_mode | default(false) | bool) else 'always' }}"
    state: started
    restart_policy: "{{ item.value.restart_policy | default('unless-stopped') }}"
    volumes: "{{ item.value.volumes | default([]) }}"
    env: "{{ item.value.environment | default({}) }}"
    command: "{{ item.value.command | default(omit) }}"
    healthcheck: "{{ item.value.healthcheck | default(omit) }}"
    ports: "{{ item.value.ports | default([]) }}"
    network_mode: "{{ item.value.network_mode | default(omit) }}"
    labels:
      kolla_version: "2025.2"
      service: palimpsest
      config_hash: "{{ palimpsest_config_stat.stat.checksum | default('') }}"
  no_log: true
  loop: "{{ palimpsest_services | dict2items }}"
  when:
    - inventory_hostname in groups['palimpsest']
    - item.value.enabled | bool
