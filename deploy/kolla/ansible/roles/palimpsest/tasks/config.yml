---
- name: Config | Ensure Palimpsest config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ palimpsest_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: inventory_hostname in groups['palimpsest']

- name: Config | Render palimpsest.conf
  become: true
  ansible.builtin.template:
    src: palimpsest.conf.j2
    dest: "{{ palimpsest_config_dir }}/palimpsest.conf"
    mode: "0640"
    owner: root
    group: root
  when: inventory_hostname in groups['palimpsest']
