---
- name: HAProxy | Validate Palimpsest public route hostname
  ansible.builtin.assert:
    that:
      - palimpsest_public_haproxy_fqdn is match('^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$')
      - palimpsest_public_endpoint_url is match('^https://[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]/?\\Z')
      - (palimpsest_public_endpoint_url | regex_replace('/$', '')) == ('https://' ~ palimpsest_public_haproxy_fqdn)
    fail_msg: "palimpsest_public_endpoint_url must be the HTTPS origin for palimpsest_public_haproxy_fqdn"
  run_once: true
  tags: always
  when:
    - enable_palimpsest_hub_api | bool
    - inventory_hostname not in groups.get('palimpsest-build-worker', [])
    - palimpsest_public_haproxy_enabled | bool

- name: HAProxy | Remove disabled Palimpsest public route destination
  become: true
  ansible.builtin.file:
    path: "{{ node_config_directory }}/haproxy/services.d/palimpsest-public.cfg"
    state: absent
  when:
    - inventory_hostname not in groups.get('palimpsest-build-worker', [])
    - not (palimpsest_public_haproxy_enabled | bool)

- name: HAProxy | Remove disabled Palimpsest external frontend map
  become: true
  ansible.builtin.blockinfile:
    path: "{{ node_config_directory }}/haproxy/external-frontend-map"
    marker: "# {mark} palimpsest-public"
    state: absent
  when:
    - inventory_hostname not in groups.get('palimpsest-build-worker', [])
    - not (palimpsest_public_haproxy_enabled | bool)

- name: Configure loadbalancer for Palimpsest
  ansible.builtin.include_role:
    name: loadbalancer-config
  vars:
    project_name: palimpsest
    project_services: "{{ palimpsest_haproxy_services }}"
  tags: always
  when:
    - inventory_hostname not in groups.get('palimpsest-build-worker', [])
    - enable_palimpsest_hub_api | bool
