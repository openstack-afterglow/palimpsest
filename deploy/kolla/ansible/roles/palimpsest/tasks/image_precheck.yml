---
- name: Select host-local Palimpsest services
  ansible.builtin.include_tasks: select_services.yml

- name: Image precheck | Validate enabled local Palimpsest image references
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/validate_image_ref.py"
      - "{{ lookup('vars', item.value.image_var) }}"
      - "{{ palimpsest_source_mode | bool | lower }}"
  changed_when: false
  loop: "{{ palimpsest_local_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false

- name: Image precheck | Inspect enabled local remote image manifests
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - manifest
      - inspect
      - "{{ lookup('vars', item.value.image_var) }}"
  changed_when: false
  loop: "{{ palimpsest_local_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (palimpsest_source_mode | bool)
