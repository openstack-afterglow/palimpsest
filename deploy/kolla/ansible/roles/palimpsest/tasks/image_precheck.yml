---
- name: Image precheck | Validate enabled Palimpsest image references
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/validate_image_ref.py"
      - "{{ item.value.image }}"
      - "{{ palimpsest_source_mode | default(false) | bool | lower }}"
  changed_when: false
  loop: "{{ palimpsest_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  delegate_to: "{{ groups['deployment'][0] }}"
  when:
    - enable_palimpsest | bool
    - item.value.enabled | bool

- name: Image precheck | Inspect enabled remote Palimpsest image manifests
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - manifest
      - inspect
      - "{{ item.value.image }}"
  changed_when: false
  loop: "{{ palimpsest_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true
  delegate_to: "{{ groups['palimpsest'] | first }}"
  when:
    - enable_palimpsest | bool
    - item.value.enabled | bool
    - not (palimpsest_source_mode | default(false) | bool)
