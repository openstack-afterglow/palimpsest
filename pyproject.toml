[project]
name = "palimpsest-client"
version = "0.2.3"
description = "Verified local OCI artifacts, KVM lifecycle, and Kolla-Ansible role data for Afterglow Palimpsest"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Afterglow" }]
dependencies = []

[project.optional-dependencies]
kvm = ["libvirt-python>=10.0.0"]
dev = ["pytest>=9.0.3", "ruff>=0.7.0", "pyyaml>=6.0", "jinja2>=3.1.6"]

[project.scripts]
palimpsest = "palimpsest_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest_local"]

[tool.hatch.build.targets.wheel.shared-data]
"deploy/kolla/ansible/roles/palimpsest" = "share/kolla-ansible/ansible/roles/palimpsest"

[tool.pytest.ini_options]
markers = [
    "buildkit_e2e: requires Docker Buildx and a running docker-container builder",
    "guest_stage1_binary: executes the packaged freestanding x86_64 stage-1 ELF under Docker",
    "stage1_kvm: requires native Linux x86_64 KVM for actual PID1 block/filesystem proof matrices",
    "oci_root_libvirt: requires the explicitly enabled native qemu:///system OCI-root lifecycle qualification",
    "oci_root_e2e: requires Linux KVM and an OCI-root capable Palimpsest runtime",
    "kvm: requires a Linux host with KVM, libvirt, and guest fixtures",
    "oci_fs: requires Linux root and filesystem tools for privileged OverlayFS testing",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
