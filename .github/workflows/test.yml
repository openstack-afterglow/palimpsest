name: Test

on:
  workflow_call:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read

jobs:
  pure:
    name: Pure contracts (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run python -c "import palimpsest_local; import palimpsest_local.cli"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest tests/unit -v
      - run: uv build
      - run: python -m zipfile -t dist/*.whl
      - run: tar -tzf dist/*.tar.gz

  hub:
    name: Hub tests, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run python -c "from palimpsest_hub.main import app; assert app.title == 'Palimpsest Hub'"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - run: uv build
      - run: python -m zipfile -t dist/*.whl
      - run: tar -tzf dist/*.tar.gz

  kvm:
    name: KVM end to end
    if: vars.PALIMPSEST_KVM_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, kvm]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test -c /dev/kvm
      - run: virsh -c qemu:///system net-info default
      - run: uv sync --frozen --extra dev --extra kvm
      - run: uv run python -m pytest -m kvm tests/kvm -vv
